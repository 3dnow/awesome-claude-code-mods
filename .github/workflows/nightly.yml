name: nightly scan

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Open a pull request even when only stars and timestamps moved"
        type: boolean
        default: false
  pull_request:
    paths: ["tools/**", "data/seeds.txt", "package.json", "package-lock.json", ".github/workflows/nightly.yml", ".github/workflows/weekly-retirement.yml"]

permissions:
  contents: write
  pull-requests: write

# One scan at a time: every run searches GitHub code with the same token, and two runs in the
# same minute rate-limit each other into hints of ten minutes and more.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      # PRs include submitted seeds without spending the global search rate limit.
      - run: npm run discover
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node tools/candidates.mjs --base "$PR_BASE"
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run scan -- --repos data/pr-repos.txt --required data/pr-required.txt
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run scan
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run render
      - run: npm run lint
      - name: Decide whether the change is worth a pull request
        id: worth
        if: github.event_name != 'pull_request'
        run: |
          set +e
          node tools/changed.mjs > change.txt
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            cat change.txt || true
            echo "The scan looks partial; failing instead of opening a pull request." >&2
            exit 1
          elif [ "$rc" = "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "weekly refresh: stars and timestamps only" > change.txt
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            git checkout -- .
          fi
          cat change.txt || true
          rm -f change.txt
      - name: Open or update the scan pull request
        if: github.event_name != 'pull_request' && steps.worth.outputs.open == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nightly-scan
          title: "Nightly scan: refresh footprints and badges"
          commit-message: "Nightly scan: refresh footprints and badges"
          body: "Automated discovery and rescan against the current Claude Code release. Known candidates are retained; missing plugins remain unverified until the weekly retirement review. Opened when inventory or validation changes; Sundays also refresh stars. Review catalogue.md and data/mods.json before merging."
          labels: scan
